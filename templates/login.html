
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | IntervAI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <header class="topbar">

        <!-- IntervAI Logo -->
        <a href="/" class="brand">
            <span class="brand-icon">🤖</span>
            Interv<span class="brand-ai">AI</span>
        </a>

        <!-- Back to Home -->
        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </header>

    <main class="page-container">

        <section class="login-card">

            <div class="welcome-icon">🤖</div>

            <div class="welcome-label">
                YOUR AI INTERVIEW PARTNER
            </div>

            <h1>Welcome <span>Back!</span></h1>

            <p class="subtitle">
                Login to continue your interview preparation.
            </p>

            

            <!-- Login Form -->
            <form action="{{ url_for('login') }}" method="POST">

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <div class="input-wrapper">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <div class="password-heading">
                        <label for="password">Password</label>
                    </div>

                    <div class="input-wrapper">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <button type="submit" class="login-submit">

                    <span>Login to Your Account</span>

                    <span class="button-arrow">→</span>

                </button>

            </form>

            <div class="separator">
                <span>YOUR NEXT OPPORTUNITY STARTS HERE</span>
            </div>

            <!-- Register Link -->
            <p class="register-text">
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

            <div class="secure-note">
                <span>🔐</span>
                <span>
                    Your account is protected by secure login.
                </span>
            </div>

        </section>

        <p class="page-footer">
            © 2026 IntervAI · Prepare Smarter. Interview Better.
        </p>

    </main>

    <!-- Show / Hide Password -->
    <script>
        const togglePassword = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");

        togglePassword.addEventListener("click", function () {

            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";

            togglePassword.textContent = isPassword ? "Hide" : "Show";

            togglePassword.setAttribute(
                "aria-label",
                isPassword ? "Hide password" : "Show password"
            );

        });
    </script>

</body>
</html>
```
